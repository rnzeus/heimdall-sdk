name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: yarn
      - run: npm install -g npm@11
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn knip
      - run: yarn dupes
      - run: yarn test
      - run: yarn build
      - run: npm stage publish --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
